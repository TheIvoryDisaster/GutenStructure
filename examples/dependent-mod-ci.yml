# TWR baseline checks; does not run the real Rivalry Core integration suite.
name: CI
on:
  pull_request:
    branches: [beta, main, release]
  push:
    branches: [beta, main, release]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/build-dotnet.yml@0ef1d783148f161894193d1aa322650b88b75bd5
    with:
      dotnet-version: 10.0.x
      project: modgen/meitou/LivingWastelandMeitou.Tests/LivingWastelandMeitou.Tests.csproj
  python:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/build-python.yml@0ef1d783148f161894193d1aa322650b88b75bd5
    with:
      test-command: python -m compileall -q modgen server/tools
  release-readiness:
    name: Release readiness
    if: always()
    needs: [rules, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all prerequisite checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python - <<'PYCODE'
          import os
          results = os.environ['RESULTS'].split(',')
          if not results or any(result != 'success' for result in results):
              raise SystemExit('A required check failed, was cancelled, or was skipped')
          PYCODE
