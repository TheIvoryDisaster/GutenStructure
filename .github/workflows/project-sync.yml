name: Synchronize Meitou project
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes (false previews only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: meitou-project-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'TheIvoryDisaster/GutenStructure' && github.ref == 'refs/heads/main'
    environment: Default
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate manifest
        run: python scripts/sync_project.py --validate-only
      - name: Preview or apply project changes
        env:
          MEITOU_PROJECT_TOKEN: ${{ secrets.MEITOU_PROJECT_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$MEITOU_PROJECT_TOKEN" ]; then
            echo '::error::Set the MEITOU_PROJECT_TOKEN Actions secret in GutenStructure. Project synchronization has not run.'
            exit 1
          fi
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python scripts/sync_project.py "${args[@]}"
