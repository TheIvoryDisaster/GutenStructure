name: CI
on:
  pull_request:
  push:
    branches: [main, beta, release]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive terraform
      - working-directory: terraform/modules/repository-storage
        run: |
          terraform init -backend=false -input=false
          terraform validate
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_project.py --validate-only
      - run: python -m scripts.apply_release_policy --validate-only
  release-readiness:
    name: Release readiness
    if: always()
    needs: [terraform, automation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all prerequisite checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python - <<'PYCODE'
          import os
          results = os.environ['RESULTS'].split(',')
          if not results or any(result != 'success' for result in results):
              raise SystemExit('A required check failed, was cancelled, or was skipped')
          PYCODE
