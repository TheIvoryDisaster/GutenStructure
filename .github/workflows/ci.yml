name: CI
on:
  pull_request:
  push:
    branches: [main, beta, release]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive terraform
      - working-directory: terraform/modules/repository-storage
        run: |
          terraform init -backend=false -input=false
          terraform validate
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_project.py --validate-only
      - run: python -m scripts.apply_release_policy --validate-only
  refcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 11.0.x
      - run: dotnet build tools/refcheck/RefCheck.csproj -c Release -nologo
  workshop-watcher:
    name: Workshop watcher (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # powershell is Windows PowerShell 5.1, which every modder's PC has; pwsh is PowerShell 7.
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 6) { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null }
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Test
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path tests/workshop-watcher -Output Detailed -CI
  release-readiness:
    name: Release readiness
    if: always()
    needs: [terraform, automation, refcheck, workshop-watcher]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all prerequisite checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python - <<'PYCODE'
          import os
          results = os.environ['RESULTS'].split(',')
          if not results or any(result != 'success' for result in results):
              raise SystemExit('A required check failed, was cancelled, or was skipped')
          PYCODE
