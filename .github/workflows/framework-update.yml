# Reusable: moves the caller's meitou.lock.json to the newest published framework releases and proposes it as a PR (docs/framework-update.md).
#
# - check (read-only token, no persisted credentials): runs scripts/framework_update.py from GutenStructure at tools-ref (or, without it, from
#   the caller's build/gutenstructure submodule), moves the engine submodule to the releases' engine commit, then builds and tests the caller with the new lock (strict engine
#   check). Uploads the changed files and the result. Nothing is written to the repository here.
# - propose (contents, pull-requests and actions: write on the caller's own GITHUB_TOKEN; runs nothing from the caller): commits those files
#   to framework-update/<channel>, opens or updates the PR into the base branch, dispatches the caller's CI on it (a PR opened with
#   GITHUB_TOKEN triggers no workflows), waits for it and merges when it is green and the base branch's rules allow. A failing PR stays open
#   as the regression report. No secrets are accepted; callers must not pass secrets: inherit.
name: Framework update

on:
  workflow_call:
    inputs:
      channel:
        description: release (production tags <slug>-v<version>) or beta (also beta snapshots <slug>-<version>-beta.<commit>).
        type: string
        default: release
      base:
        description: Branch the lock is moved on and the PR targets.
        type: string
        default: beta
      ci-workflow:
        description: The caller's CI workflow file, dispatched on the update branch; it must accept workflow_dispatch.
        type: string
        default: ci.yml
      test-project:
        description: Project or solution to build and test with the new lock.
        type: string
        default: .
      widen-ranges:
        description: Raise a mod's dependency upper bound to admit a new breaking version (the tests decide).
        type: boolean
        default: true
      merge:
        description: Merge the PR once the caller's CI is green.
        type: boolean
        default: true
      tools-ref:
        description: The GutenStructure ref the update script comes from; pin it to the same commit as this workflow. Empty uses build/gutenstructure.
        type: string
        default: ''
      dotnet-version:
        type: string
        default: 11.0.x
    outputs:
      changed:
        description: true when a newer release was found.
        value: ${{ jobs.check.outputs.changed }}
      tested:
        description: success or failure of the build and tests with the new lock.
        value: ${{ jobs.check.outputs.tested }}

permissions:
  contents: read

concurrency:
  group: framework-update-${{ github.repository }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
      tested: ${{ steps.test.outcome }}
    steps:
      - name: Validate inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          BASE: ${{ inputs.base }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          TEST_PROJECT: ${{ inputs.test-project }}
          TOOLS_REF: ${{ inputs.tools-ref }}
        run: |
          [[ -z "$TOOLS_REF" || "$TOOLS_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "invalid tools-ref" >&2; exit 1; }
          case "$CHANNEL" in release|beta) ;; *) echo "channel must be release or beta" >&2; exit 1 ;; esac
          [[ "$BASE" =~ ^[A-Za-z0-9._/-]+$ && "$CI_WORKFLOW" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]] || { echo "invalid base or ci-workflow" >&2; exit 1; }
          [[ "$TEST_PROJECT" != -* ]] || { echo "test-project cannot be an option" >&2; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: inputs.tools-ref != ''
        with:
          repository: TheIvoryDisaster/GutenStructure
          ref: ${{ inputs.tools-ref }}
          path: _gutenstructure
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Move the lock to the newest releases
        id: lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          WIDEN: ${{ inputs.widen-ranges }}
          TOOLS_REF: ${{ inputs.tools-ref }}
        run: |
          script=build/gutenstructure/scripts/framework_update.py
          [ -z "$TOOLS_REF" ] || script=_gutenstructure/scripts/framework_update.py
          test -f "$script" || { echo "$script missing: pin build/gutenstructure to a GutenStructure commit that has it" >&2; exit 1; }
          widen=(); [ "$WIDEN" = true ] && widen=(--widen-ranges)
          engine=$(python3 -I "$script" --channel "$CHANNEL" "${widen[@]}" --summary "$RUNNER_TEMP/framework-update.md")
          if [ -z "$engine" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The lock is on the newest $CHANNEL releases." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git -C engine fetch --depth 1 origin "$engine"
          git -C engine checkout --detach "$engine"
          echo "$engine" > "$RUNNER_TEMP/engine.txt"
          cat "$RUNNER_TEMP/framework-update.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: steps.lock.outputs.changed == 'true'
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Build and test with the new lock
        id: test
        if: steps.lock.outputs.changed == 'true'
        continue-on-error: true
        env:
          TEST_PROJECT: ${{ inputs.test-project }}
          MeitouFrameworksStrict: 'true'
        run: |
          set -o pipefail
          dotnet test "$TEST_PROJECT" --configuration Release 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Collect the changed files
        if: steps.lock.outputs.changed == 'true'
        env:
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          out="$RUNNER_TEMP/update"
          mkdir -p "$out/files"
          git diff --name-only -- meitou.lock.json '*/meitou.json' > "$out/paths.txt"
          while read -r path; do mkdir -p "$out/files/$(dirname "$path")"; cp "$path" "$out/files/$path"; done < "$out/paths.txt"
          cp "$RUNNER_TEMP/engine.txt" "$RUNNER_TEMP/framework-update.md" "$out/"
          echo "$OUTCOME" > "$out/outcome.txt"
          if [ "$OUTCOME" != success ]; then
            { echo; echo "**The build or tests failed with the new lock.** Last lines:"; echo; echo '```'; tail -n 40 "$RUNNER_TEMP/test.log"; echo '```'; } >> "$out/framework-update.md"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lock.outputs.changed == 'true'
        with:
          name: framework-update
          path: ${{ runner.temp }}/update
          retention-days: 7

  propose:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASE: ${{ inputs.base }}
      BRANCH: framework-update/${{ inputs.channel }}
      CI_WORKFLOW: ${{ inputs.ci-workflow }}
      MERGE: ${{ inputs.merge }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: framework-update
          path: ${{ runner.temp }}/update
      - name: Commit the update to its branch
        id: commit
        run: |
          update="$RUNNER_TEMP/update"
          while read -r path; do
            case "$path" in meitou.lock.json|*/meitou.json) cp "$update/files/$path" "$path" ;; *) echo "unexpected path $path" >&2; exit 1 ;; esac
          done < "$update/paths.txt"
          engine=$(cat "$update/engine.txt")
          [[ "$engine" =~ ^[0-9a-f]{40}$ ]] || { echo "bad engine commit" >&2; exit 1; }
          git update-index --cacheinfo "160000,$engine,engine"
          git add meitou.lock.json $(grep '/meitou.json$' "$update/paths.txt" || true)
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F - <<< "Move the framework lock to the newest $(basename "$BRANCH") releases"$'\n\n'"$(cat "$update/framework-update.md")"
          if git fetch -q origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "The open update already holds these releases." >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -q --force origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open or update the PR
        id: pr
        run: |
          body="$RUNNER_TEMP/update/framework-update.md"
          title="Frameworks: Move the lock to the newest $(basename "$BRANCH") releases"
          number=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body-file "$body"
            number=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$number" --body-file "$body"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          # A widened range only reaches players with a release of the mod (docs/versioning.md)
          if grep -q '/meitou.json$' "$RUNNER_TEMP/update/paths.txt"; then
            gh label create needs-release --color D93F0B --description "Merged changes only reach players with a release" --force
            gh pr edit "$number" --add-label needs-release
          fi
      - name: Run the caller's CI on the update
        if: steps.commit.outputs.pushed == 'true'
        id: ci
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run "$CI_WORKFLOW" --ref "$BRANCH"
          for _ in $(seq 30); do
            run=$(gh run list --workflow "$CI_WORKFLOW" --branch "$BRANCH" --event workflow_dispatch --commit "$SHA" --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "the dispatched CI run did not appear" >&2; exit 1; }
          gh run watch "$run" --exit-status --interval 30 > /dev/null && echo "result=success" >> "$GITHUB_OUTPUT" || echo "result=failure" >> "$GITHUB_OUTPUT"
      - name: Merge or report
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          TESTED: ${{ needs.check.outputs.tested }}
          CI_RESULT: ${{ steps.ci.outputs.result }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          [ "$PUSHED" = true ] || exit 0
          if [ "$TESTED" != success ] || [ "$CI_RESULT" != success ]; then
            echo "Regression: PR #$NUMBER stays open (tests: $TESTED, CI: ${CI_RESULT:-not run})." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$MERGE" != true ]; then
            echo "PR #$NUMBER is green; merge is off." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh pr merge "$NUMBER" --merge --delete-branch; then
            echo "Merged PR #$NUMBER." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR #$NUMBER is green but the base branch's rules kept the workflow from merging it: a maintainer merges it." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PR #$NUMBER is green; the base branch's rules need a maintainer to merge it."
          fi
