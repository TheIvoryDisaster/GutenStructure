name: Reusable production release gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: TheIvoryDisaster/GutenStructure
          ref: a89d8e46360bac865c76a9d01c522a25eef8d03e
          persist-credentials: false
      - name: Verify release branch and enforced review requirements
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_gate.py
