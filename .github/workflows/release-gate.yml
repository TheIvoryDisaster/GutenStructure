name: Reusable production release gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheIvoryDisaster/GutenStructure
          ref: b8fc4ac1481cd27e036fdd5ed8074ea826dae701
          persist-credentials: false
      - name: Verify release branch and enforced review requirements
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_gate.py
