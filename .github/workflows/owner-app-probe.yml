name: Verify owner authorization App (read-only)
on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths: [.github/workflows/owner-app-probe.yml, scripts/owner_app_probe.py, scripts/owner_check_service.py]
permissions:
  contents: read
jobs:
  probe:
    if: >-
      github.repository == 'TheIvoryDisaster/GutenStructure' &&
      (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main')
    environment: owner-check-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install JWT signing dependency
        run: python -m pip install cryptography==46.0.3
      - name: Verify installation and enumerate public repositories without changes
        env:
          OWNER_APP_ID: '5828227'
          OWNER_APP_INSTALLATION_ID: '183567989'
          OWNER_APP_PRIVATE_KEY: ${{ secrets.OWNER_APP_PRIVATE_KEY }}
        run: python -m scripts.owner_app_probe
