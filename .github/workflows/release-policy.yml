name: Configure release branch protections
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Repositories whose rulesets should be inspected
        type: choice
        options: [organization, personal]
        default: organization
      apply:
        description: Apply the previewed rulesets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-policy
  cancel-in-progress: false
jobs:
  configure:
    if: github.repository == 'TheIvoryDisaster/GutenStructure' && github.ref == 'refs/heads/main'
    environment: Default
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure organization repository protections
        if: github.event_name == 'schedule' || inputs.target == 'organization'
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.MEITOU_RELEASE_ADMIN_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python -m scripts.apply_release_policy --target Meitou-Modding-Ecosystem "${args[@]}"
      - name: Configure personally owned repository protections
        if: inputs.target == 'personal'
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.GUTENSTRUCTURE_ADMIN_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python -m scripts.apply_release_policy --target TheIvoryDisaster "${args[@]}"
